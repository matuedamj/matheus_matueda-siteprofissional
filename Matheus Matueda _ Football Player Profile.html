<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matheus Matueda | Football Player Profile</title>
<meta id="md" name="description" content="Matheus Matueda de Jesus: lateral-direito e volante. Currículo esportivo, vídeo e contato profissional.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Matheus Matueda | Football Player Profile">
<meta property="og:description" content="Right back / defensive midfielder. Career history, match footage and professional contact.">
<meta name="theme-color" content="#07110c">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<style>
:root{
  --bg:#07110c; --bg2:#0a1811; --surface:#0f2119; --surface2:#132a1f;
  --line:rgba(201,165,74,.18); --line2:rgba(230,240,232,.10);
  --fg:#eef2ec; --muted:#9db0a4; --faint:#6d8276;
  --green:#2f9e66; --green-deep:#0c3a25;
  --gold:#d1ae55; --gold-ink:#d1ae55; --gold-bg:rgba(209,174,85,.12);
  --shadow:0 20px 50px -24px rgba(0,0,0,.8);
  --hero-bg:#06100b; --on-hero:#f4f6f1; --on-hero-muted:#a8b9ae;
  color-scheme:dark;
  --display:"Big Shoulders Display","Oswald","Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Impact,sans-serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark;background:#07110c;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:.95;margin:0;letter-spacing:.005em;text-wrap:balance}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);margin:0}
.note{font-size:12.5px;color:var(--faint);line-height:1.55}
.muted{color:var(--muted);font-weight:500}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.mark b{display:grid;place-items:center;min-width:40px;height:34px;padding:0 6px;border:1px solid var(--gold);color:var(--gold-ink);font:800 15px/1 var(--display);letter-spacing:.06em}
.mark span{font:700 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.mark small{display:block;font:500 9.5px/1.3 var(--mono);letter-spacing:.16em;color:var(--muted);margin-top:3px}
.links{display:flex;gap:22px;margin-left:auto}
.links a{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.links a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line2);flex:none}
.lang button{background:none;border:0;padding:6px 9px;font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#0b1a12}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border:1px solid transparent;font:700 13px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;transition:transform .2s,background .2s,border-color .2s;border-radius:1px;background:none}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:#0b1a12;border-color:var(--gold)}
.btn.ghost{border-color:rgba(244,246,241,.28);color:#f4f6f1}
.btn.ghost:hover{border-color:var(--gold)}
.btn.line{border-color:var(--line2);color:var(--fg)}
.btn.line:hover{border-color:var(--gold)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn svg{width:16px;height:16px;flex:none}
.btn.sm{padding:9px 14px;font-size:12px}
@media(max-width:900px){.links{display:none}.lang{margin-left:auto}}
@media(max-width:620px){.top .wrap{gap:10px}.mark span{display:none}.mark b{min-width:44px;height:38px;font-size:16px}.btn.sm{padding:9px 11px;font-size:11px}}

/* hero */
.hero{background:var(--hero-bg);color:var(--on-hero);position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60% 80% at 78% 30%,rgba(47,158,102,.28),transparent 70%),
  linear-gradient(180deg,rgba(12,58,37,.45),transparent 60%)}
.hero-lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.12;pointer-events:none}
.hero .wrap{display:grid;grid-template-columns:1fr .92fr;gap:28px;align-items:end;min-height:min(78vh,680px);padding-block:56px 0;position:relative;z-index:2}
.hero-copy{padding-bottom:56px;min-width:0}
.hero h1{font-size:clamp(54px,7vw,110px);font-weight:900;text-transform:uppercase;margin-top:18px;line-height:.84}
.hero h1 span{display:block}
.hero h1 .outline{color:transparent;-webkit-text-stroke:1.5px rgba(244,246,241,.9)}
.role{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:24px;font:600 14.5px/1.3 var(--sans)}
.role span{display:flex;align-items:center;gap:8px}
.role span+span::before{content:"";width:4px;height:4px;background:var(--gold);transform:rotate(45deg);margin-right:10px}
.pitchline{margin-top:22px;max-width:52ch;color:var(--on-hero-muted);font-size:16px}
.pitchline b{color:var(--on-hero);font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero-photo{position:relative;align-self:stretch;display:flex;align-items:end;min-width:0}
.hero-photo .frame{position:relative;width:100%;max-width:540px;margin-left:auto;aspect-ratio:700/874}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;
  -webkit-mask-image:linear-gradient(180deg,#000 58%,transparent 99%);mask-image:linear-gradient(180deg,#000 58%,transparent 99%);filter:saturate(.95) contrast(1.03)}
.hero-photo .frame::after{content:"";position:absolute;top:-14px;right:-14px;width:46%;height:42%;border-top:1px solid var(--gold);border-right:1px solid var(--gold);opacity:.7}
.hero-photo .tag{position:absolute;left:-18px;bottom:26%;background:rgba(6,16,11,.82);backdrop-filter:blur(8px);border-left:2px solid var(--gold);padding:12px 16px;font:500 10.5px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#a8b9ae;max-width:80%}
.hero-photo .tag b{display:block;font:800 21px/1.1 var(--display);letter-spacing:.02em;color:#f4f6f1;margin-top:4px}
@media (max-width:1100px){
  .hero .wrap{grid-template-columns:1.05fr .95fr;min-height:0;padding-block:26px 0;gap:18px}
  .hero-photo .frame{max-width:100%;margin-left:auto}
  .hero-photo .tag{left:0;bottom:14%}
  .hero-copy{padding-bottom:38px}
  .hero h1{font-size:clamp(38px,7.6vw,72px)}
}
@media (max-width:640px){
  .hero .wrap{grid-template-columns:1fr .78fr;gap:12px;padding-block:20px 0;align-items:stretch}
  .hero-photo{align-items:stretch}
  .hero-photo .frame{height:100%;min-height:340px}
  .hero h1{font-size:clamp(30px,8.6vw,46px);margin-top:12px}
  .role{font-size:12.5px;gap:6px 12px;margin-top:16px}
  .role span+span::before{margin-right:8px}
  .pitchline{font-size:13.5px;margin-top:14px}
  .cta{gap:8px;margin-top:18px}
  .cta .btn{padding:11px 13px;font-size:11px;gap:7px}
  .hero-copy{padding-bottom:26px}
  .hero-photo .frame{aspect-ratio:auto}
  .hero-photo img{object-position:50% 8%}
  .hero-photo .tag{left:0;right:0;bottom:6%;padding:8px 10px;font-size:9px;max-width:none}
  .hero-photo .tag b{font-size:15px;margin-top:2px}
}

/* strip */
.sixty{border-bottom:1px solid var(--line2);background:var(--bg2)}
.sixty-head{display:flex;align-items:center;gap:14px;padding-top:22px;flex-wrap:wrap}
.sixty-head .clock{font:800 22px/1 var(--display);color:var(--gold-ink)}
.sixty-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:1px solid var(--line2);margin-block:20px 24px}
.sx{padding:14px 16px 16px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-width:0}
.sx .q{font:500 10px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sx .a{font:700 14.5px/1.35 var(--sans);margin-top:8px;text-decoration:none;display:block}
.sx .a small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:3px}
.sx a.a{color:var(--gold-ink)}
@media (max-width:620px){.sixty-grid{grid-template-columns:1fr}}

/* sections */
section.block{padding-block:64px}
section[id],#top{scroll-margin-top:74px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.sec-head h2{font-size:clamp(36px,6vw,64px);font-weight:800;text-transform:uppercase}
.sec-head p{max-width:46ch;margin:0;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.6;margin-top:14px;width:120px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.kpi{background:var(--surface);padding:22px 20px 20px;min-width:0}
.kpi .n{font:800 clamp(38px,5vw,58px)/.9 var(--display);font-variant-numeric:tabular-nums}
.kpi .l{font:500 10.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.kpi .s{font-size:12px;color:var(--faint);margin-top:4px}
.kpi.accent .n{color:var(--gold-ink)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:1/-1}}
#kpiNote{margin-top:14px}

/* timeline */
.tl{position:relative;display:grid}
.tl::before{content:"";position:absolute;left:31px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold),var(--line2) 30%,var(--line2))}
.tl-item{display:grid;grid-template-columns:64px 1fr;gap:22px;padding-block:22px;position:relative}
.crest{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;z-index:1;overflow:hidden;font:800 18px/1 var(--display);color:var(--gold-ink)}
.crest img{width:46px;height:46px;object-fit:contain}
.tl-body{min-width:0;border-bottom:1px solid var(--line2);padding-bottom:22px}
.tl-item:last-child .tl-body{border-bottom:0}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.tl-year{font:500 12px/1 var(--mono);letter-spacing:.12em;color:var(--gold-ink)}
.tl-club{font:800 clamp(24px,3.4vw,34px)/1 var(--display);text-transform:uppercase}
.flag{width:20px;height:14px;display:inline-block;vertical-align:-2px;box-shadow:0 0 0 1px var(--line2);margin-left:10px}
.tl-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid var(--line2);font:500 11px/1.2 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.chip.gold{border-color:var(--line);color:var(--gold-ink);background:var(--gold-bg)}
.comps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:7px}
.comps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;max-width:860px}
.comps li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;background:var(--line2);transform:rotate(45deg);outline:1px solid var(--faint)}
.comps li.win::before{background:var(--gold);outline-color:var(--gold)}
.comps li.vice::before{background:transparent;outline-color:var(--gold)}
.comps li.plus::before{content:"+";width:auto;height:auto;margin-top:0;background:none;outline:0;transform:none;color:var(--gold-ink);font:700 16px/1.45 var(--sans)}
.comps .sub{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.badge{flex:none;font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;margin-left:auto;white-space:nowrap;align-self:flex-start}
.badge.w{background:var(--gold);color:#0b1a12}
.badge.v{border:1px solid var(--gold);color:var(--gold-ink)}
.badge.s{border:1px solid var(--line2);color:var(--muted)}
.mini{display:flex;flex-wrap:wrap;margin-top:16px;border:1px solid var(--line2);width:fit-content;max-width:100%}
.mini div{padding:8px 14px;border-right:1px solid var(--line2)}
.mini div:last-child{border-right:0}
.mini b{display:block;font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.mini b.na{font:500 13px/1.6 var(--mono);color:var(--faint)}
.mini span{font:500 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.tl::before{left:23px}.tl-item{grid-template-columns:48px 1fr;gap:14px}.crest{width:48px;height:48px;font-size:14px}.crest img{width:34px;height:34px}.badge{margin-left:0}}

/* cards */
.profile{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:860px){.profile{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line2);padding:26px;min-width:0}
.card h3{font-size:24px;font-weight:800;text-transform:uppercase}
dl.facts{display:grid;grid-template-columns:auto 1fr;margin:18px 0 0;border-top:1px solid var(--line2)}
dl.facts dt,dl.facts dd{padding:11px 0;border-bottom:1px solid var(--line2);margin:0}
dl.facts dt{font:500 10.5px/1.9 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-right:18px}
dl.facts dd{font-weight:600;text-align:right}
.pitch-wrap{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center;margin-top:18px}
@media (max-width:420px){.pitch-wrap{grid-template-columns:110px 1fr;gap:14px}}
.pitch{width:100%;height:auto;display:block}
.pos-list{display:grid;gap:10px;min-width:0}
.pos{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line2);background:var(--surface2);min-width:0}
.pos i{font:800 18px/1 var(--display);font-style:normal;width:44px;color:var(--gold-ink)}
.pos div{min-width:0}
.pos b{display:block;font-size:14px}
.pos small{color:var(--muted);font-size:12px}
.card h3.sub{margin-top:26px;font-size:20px}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.trait{padding:8px 13px;border:1px solid var(--line);background:var(--gold-bg);font:600 13px/1 var(--sans)}

/* video */
.video{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center}
@media (max-width:860px){.video{grid-template-columns:1fr}}
.vcard{position:relative;display:block;aspect-ratio:1072/651;overflow:hidden;background:#000;border:1px solid var(--line);text-decoration:none}
.vcard img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .4s;opacity:.86}
.vcard:hover img{transform:scale(1.04);opacity:1}
.vcard .play{position:absolute;inset:0;display:grid;place-items:center}
.vcard .play span{width:84px;height:84px;border-radius:50%;background:var(--gold);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(209,174,85,.2);transition:box-shadow .3s}
.vcard:hover .play span{box-shadow:0 0 0 20px rgba(209,174,85,.14)}
.vcard .play svg{width:30px;height:30px;margin-left:5px;fill:#0b1a12}
.vcard .yt{position:absolute;left:0;right:0;bottom:0;padding:16px 18px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.vrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:14px}
.vrow span:first-child{color:var(--muted);font:500 10.5px/1.9 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.vrow span:last-child{font-weight:600;text-align:right}
.vlist{margin-top:16px}
.video .card .cta{margin-top:18px}

/* scouting report */
.sr-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.toast{font:500 12px/1 var(--mono);color:var(--green);letter-spacing:.06em;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
.sr-doc{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.sr-top{display:grid;grid-template-columns:140px 1fr auto;gap:24px;padding:28px;border-bottom:1px solid var(--line2);align-items:center}
.sr-top img{width:140px;height:170px;object-fit:cover;object-position:50% 12%;display:block}
.sr-top h2{font-size:clamp(32px,5vw,52px);text-transform:uppercase;font-weight:900;margin-top:6px}
.sr-sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.sr-stamp{border:1px solid var(--gold);padding:10px 14px;text-align:center;font:500 10px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.sr-stamp b{display:block;font:900 30px/1 var(--display);color:var(--fg);letter-spacing:.02em}
@media (max-width:760px){.sr-top{grid-template-columns:96px 1fr;padding:20px;gap:16px}.sr-top img{width:96px;height:118px}.sr-stamp{grid-column:1/-1;justify-self:start}}
.sr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.sr-sec{padding:24px 28px;border-bottom:1px solid var(--line2);min-width:0}
.sr-grid .sr-sec:nth-child(odd){border-right:1px solid var(--line2)}
@media (max-width:760px){.sr-grid{grid-template-columns:1fr}.sr-grid .sr-sec:nth-child(odd){border-right:0}.sr-sec{padding:20px}}
.sr-sec h4{margin:0 0 12px;font:500 10.5px/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);display:flex;gap:10px;align-items:center}
.sr-sec h4::before{content:attr(data-n);color:var(--faint)}
.sr-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px;margin:0}
.sr-kv dt{color:var(--muted)}
.sr-kv dd{margin:0;font-weight:600;text-align:right}
.sr-kv dd.pend{color:var(--faint);font-weight:500;font-style:italic}
.sr-list{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.sr-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line2);padding-bottom:6px}
.sr-list li span:last-child{color:var(--muted);text-align:right;white-space:nowrap}
.sr-list a{color:var(--gold-ink)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);background:var(--bg2)}
.tbl-wrap table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tbl-wrap th,.tbl-wrap td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl-wrap th{font:500 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.tbl-wrap th:first-child,.tbl-wrap td:first-child,.tbl-wrap th:nth-child(2),.tbl-wrap td:nth-child(2),.tbl-wrap th:nth-child(3),.tbl-wrap td:nth-child(3){text-align:left}
.tbl-wrap tfoot td{font-weight:700;border-bottom:0;background:var(--gold-bg)}

/* press */
.press{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.press{grid-template-columns:1fr}}
.pcard{display:flex;flex-direction:column;gap:12px;padding:26px;background:var(--surface);border:1px solid var(--line2);text-decoration:none;transition:border-color .25s,transform .25s;min-width:0}
.pcard:hover{border-color:var(--gold);transform:translateY(-3px)}
.pcard .src{display:flex;justify-content:space-between;gap:12px;font:500 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.pcard .src span:last-child{color:var(--faint)}
.pcard h3{font:800 23px/1.08 var(--display);text-transform:none}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.pcard blockquote{margin:4px 0 0;padding-left:14px;border-left:2px solid var(--gold);font-style:italic;font-size:15px}
.pcard .go{margin-top:auto;padding-top:8px;font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-ink)}

/* contact */
.contact p{margin:0;color:var(--muted);max-width:52ch}
.contact .cta{margin-top:22px}
.band{background:var(--green-deep);color:#f4f6f1}
.band .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;padding-block:44px}
.band h3{font-size:clamp(28px,4.2vw,46px);text-transform:uppercase;font-weight:900;max-width:22ch;font-family:var(--display);line-height:.95;margin:0}
.band p{margin:10px 0 0;color:#b9cbbf;max-width:52ch}
.band .cta{margin-top:0}
footer{border-top:1px solid var(--line2);background:var(--bg2);padding-block:26px;text-align:center;font:500 10.5px/1.8 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.btn,.pcard,.vcard img{transition:none}}
</style>

function pitch(d){return `<svg class="pitch" viewBox="0 0 120 170" role="img" aria-label="${d.pitchAlt}">
 <rect x="2" y="2" width="116" height="166" fill="var(--green-deep)" stroke="var(--line)"/>

</svg>`}

function compsOf(t){
  const raw=t[5]?String(t[5]).split('|'):[];
  const out=raw.map(x=>{
    let note='';
    x=x.replace(/<span class="note">([\s\S]*?)<\/span>/,(m,g)=>{note=g;return ''});
    let res='';
    x=x.replace(/\s*·\s*<b>([\s\S]*?)<\/b>\s*/,(m,g)=>{res=g;return ''});
    return {name:x.trim(),res:res.trim(),note:note.trim()};
  });
  if(t[6]&&out.length&&!out[0].res)out[0].res=String(t[6]).trim();
  return out;
}
const statsOf=n=>((A.estatisticas||{})[n]||[]);
const sumOf=(e,k)=>e.some(x=>x[k]!=null)?e.reduce((a,x)=>a+(+x[k]||0),0):null;

const TOT=(()=>{const o={clubs:0,j:0,m:0,g:0,a:0,jGA:0,mGA:0,semGA:[],w:0,v:0,s:0};
 A.trajetoria.forEach(t=>{o.clubs++;const e=statsOf(t[1]);
  const j=sumOf(e,'jogos')||0,m=sumOf(e,'min')||0,g=sumOf(e,'gols'),a=sumOf(e,'assist');
  o.j+=j;o.m+=m;
  if(g==null&&a==null)o.semGA.push(t[1]);else{o.g+=g||0;o.a+=a||0;o.jGA+=j;o.mGA+=m}
  compsOf(t).forEach(x=>{if(!x.res)return;if(/^Vice/.test(x.res))o.v++;else if(/Campeão/.test(x.res))o.w++;else o.s++})});
 return o})();

function paint(){
 const d=D[lang],en=lang==='en',fmt=n=>Number(n).toLocaleString(d.code);
 const tv=x=>en&&VAL[x]?VAL[x]:x;
 const tcat=s=>en?s.replace(/Sub-(\d+)/g,'U$1').replace('Profissional','Professional').replace(/ e /g,' and '):s;
 const tc=s=>en?s.replace(/Sub-(\d+)/g,'U$1')
    .replace('Campeonato Paulista','Paulista Championship')
    .replace('Campeonato Sul-Mato-Grossense','Mato Grosso do Sul State Championship')
    .replace('Lista da Copinha','Copinha squad list').replace('Amistosos','Friendlies').replace('(não contabilizados)','(not counted in the totals)').replace('disputou apenas os 5 jogos finais da competição','played only the last 5 games of the competition')
    .replace('não disputou: porque foi emprestado ao Águia Negra, no profissional, na mesma época da Copinha','did not play: he was loaned to Águia Negra, senior team, in the same period as the Copinha'):s;
 const tres=r=>!r?'':(en?(/^Vice/.test(r)?'Runner-up':/Campeão/.test(r)?'Champion':'Semifinalist'):r);
 const fd=s=>{const m=en&&/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s);return m?new Date(+m[3],+m[2]-1,+m[1]).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):s};

 document.documentElement.lang=en?'en':'pt-BR';
 document.title=en?'Matheus Matueda | Football Player Profile':'Matheus Matueda | Perfil de atleta de futebol';
 const md=$('md'); if(md)md.content=en?'Matheus Matueda de Jesus: right back and defensive midfielder. Career history, match footage and professional contact.':'Matheus Matueda de Jesus: lateral-direito e volante. Currículo esportivo, vídeo e contato profissional.';
 document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
 set('markSub',d.sub);
 html('nav',d.nav.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join(''));

 /* hero */
 set('heroEyebrow',d.eyebrow);
 html('heroRole',[`${d.pos[0][1]} · ${d.pos[1][1]}`,`${flag('br')} ${en?'Brazil':'Brasil'}`,`${AGE} ${en?'years':'anos'}`,en?'1.75 m':HEIGHT,en?'Right-footed':'Destro'].map(r=>`<span>${r}</span>`).join(''));
 html('heroPitch',d.pitch);
 html('heroCta',`<a class="btn gold" href="#scouting">${ICON.doc}Scouting Report</a>`+(A.video&&A.video.url?`<a class="btn ghost" href="#video">${ICON.play}${d.bWatch}</a>`:'')+`<a class="btn ghost" href="#contato">${ICON.wa}${d.bContact}</a>`);
 html('heroTag',`${d.tagLabel}<b>${d.tagValue}</b>`);
 if(c.whatsapp){$('navcta').href='https://wa.me/'+c.whatsapp;$('navcta').textContent='WhatsApp'}else $('navcta').remove();

 /* strip */
 set('sixtyHead',d.sixtyHead);
 const sxItems=[
  [d.sixtyQ[0],A.nome,d.sixtyWho],
  [d.sixtyQ[1],d.pos[0][1],d.sixtyPos],
  [d.sixtyQ[2],`${TOT.clubs} ${en?'clubs':'clubes'} · 2 ${en?'countries':'países'}`,d.sixtyClubs],
  [d.sixtyQ[3],`${TOT.j} ${d.srGames} · ${TOT.g+TOT.a} G+A`,`${TOT.g} ${d.sixtyNum} · ${TOT.a} ${d.sixtyNum2}`],
  [d.sixtyQ[4],d.sixtyVid+' ↗',d.sixtyVid2,A.video&&A.video.url],
  [d.sixtyQ[5],d.sixtyWa+' ↗','+55 11 95453-9870',c.whatsapp?WA(d.waHello):'']];
 html('sixty',sxItems.map(s=>`<div class="sx"><div class="q">${s[0]}</div>${s[3]?`<a class="a" href="${s[3]}" target="_blank" rel="noopener">${s[1]}<small>${s[2]}</small></a>`:`<div class="a">${s[1]}<small>${s[2]}</small></div>`}</div>`).join(''));

 /* kpis */
 set('e-kpi',d.eKpi); set('h-kpi',d.hKpi); set('p-kpi',d.pKpi);
 const perGame=TOT.j?Math.round(TOT.m/TOT.j):0;
 const K=[[TOT.j,d.kpi[0],`${TOT.clubs} ${d.kpiSub[0]}`],
          [TOT.m,d.kpi[1],`${TOT.j} ${d.kpiSub[3]}`],
          [TOT.g,d.kpi[2],`${d.kpiSub[2]} ${TOT.jGA} ${d.kpiSub[3]}`],
          [TOT.a,d.kpi[3],`${d.kpiSub[2]} ${TOT.jGA} ${d.kpiSub[3]}`,1],
          [TOT.w,d.kpi[4],`+ ${TOT.v} ${d.kpiSub[4]} · ${TOT.s} ${d.kpiSub[5]}`]];
 html('kpis',K.map(k=>`<div class="kpi${k[3]?' accent':''}"><div class="n" data-count="${k[0]}">${fmt(k[0])}</div><div class="l">${k[1]}</div><div class="s">${k[2]}</div></div>`).join(''));

 /* currículo */
 set('h-cv',d.hCv); set('p-cv',d.pCv);
 html('tl',A.trajetoria.map(t=>{
   const e=statsOf(t[1]), cp=compsOf(t);
   const mini=[['jogos'],['gols'],['assist'],['min']].map((k,i)=>{
     const v=sumOf(e,k[0]);
     return `<div><b class="${v==null?'na':''}">${v==null?d.na:(k[0]==='min'?fmt(v):v)}</b><span>${d.mini[i]}</span></div>`}).join('');
   const comps=cp.length?`<ul class="comps">${cp.map(x=>{
     const plus=/^\+/.test(x.name);
     const cls=(plus?'plus ':'')+(x.res?(/^Vice/.test(x.res)?'vice':/Campeão/.test(x.res)?'win':''):'');
     const bcl=x.res?(/^Vice/.test(x.res)?'v':/Campeão/.test(x.res)?'w':'s'):'';
     return `<li class="${cls}"><div>${tc(plus?x.name.replace(/^\+\s*/,''):x.name)}${x.note?`<span class="sub">${tc(x.note)}</span>`:''}</div>${x.res?`<span class="badge ${bcl}">${tres(x.res)}</span>`:''}</li>`}).join('')}</ul>`:'';
   const nota=e[0]&&e[0].nota?`<p class="note">${en?e[0].nota.replace('Titular em cerca de','Starter for about').replace('do tempo jogado','of the time played'):e[0].nota}</p>`:'';
   return `<article class="tl-item"><div class="crest">${t[3]?`<img src="${t[3]}" alt="${en?'Crest':'Escudo'} ${t[1]}">`:ini(t[1])}</div>
     <div class="tl-body">
       <div class="tl-top">${t[0]?`<span class="tl-year">${t[0]}</span>`:''}<h3 class="tl-club">${t[1]}${flag(t[4])}</h3></div>
       <div class="tl-meta"><span class="chip">${tcat(t[2])}</span>${t[7]?`<span class="chip gold">${d.loan}</span>`:''}</div>
       ${comps}<div class="mini">${mini}</div>${nota}
     </div></article>`}).join(''));

 /* perfil */
 set('h-prof',d.hProf); set('p-prof',d.pProf); set('t-facts',d.tFacts); set('t-pos',d.tPos); set('t-traits',d.tTraits);
 html('posWrap',pitch(d)+`<div class="pos-list">${d.pos.map(x=>`<div class="pos"><i>${x[0]}</i><div><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div>`);
 html('facts',d.facts.map(f=>`<dt>${f[0]}</dt><dd>${fd(String(f[1]))}</dd>`).join(''));
 html('traits',A.atributos.map(a=>`<span class="trait">${tv(a[0])}</span>`).join(''));

 /* scouting report */
 set('e-sr',d.eSr); set('h-sr','Scouting Report'); set('p-sr',d.pSr);
 const kov=statsOf('NK Kovinar')[0]||{};
 const ga90=TOT.mGA?((TOT.g+TOT.a)/TOT.mGA*90):0;
 const kv=(k,v,pend)=>`<dt>${k}</dt><dd${pend?' class="pend"':''}>${v}</dd>`;
 const sec=(n,title,body)=>`<div class="sr-sec"><h4 data-n="${n}">${title}</h4>${body}</div>`;
 const titles=A.trajetoria.flatMap(t=>compsOf(t).filter(x=>x.res).map(x=>`<li><span>${tc(x.name)} <span class="muted">· ${t[1]}${t[0]?', '+t[0]:''}</span></span><span>${tres(x.res)}</span></li>`)).join('');
 html('srdoc',`<div class="sr-top">
   <img src="${PHOTO}" alt="Matheus Matueda">
   <div><p class="eyebrow">Scouting Report</p><h2>Matheus Matueda</h2>
     <p class="sr-sub">${d.pos[0][1]} · ${d.pos[1][1]} · ${flag('br')} ${en?'Brazil':'Brasil'} · ${AGE} ${en?'yrs':'anos'}</p></div>
   <div class="sr-stamp">${d.srStamp}<b>${d.pos[0][0]} / ${d.pos[1][0]}</b></div>
 </div>
 <div class="sr-grid">
  ${sec('01',d.srSec[0],`<dl class="sr-kv">${kv(d.srId[0],A.nome)}${kv(d.srId[1],en?'9 May 2007':'09/05/2007')}${kv(d.srId[2],en?'Brazil':'Brasil')}${kv(d.srId[3],en?'1.75 m':HEIGHT)}${kv(d.srId[4],'68 kg')}${kv(d.srId[5],en?'Right':FOOT)}</dl>`)}
  ${sec('02',d.srSec[1],`<dl class="sr-kv">${kv(d.srPlay[0],d.pos[0][1])}${kv(d.srPlay[1],d.pos[1][1])}${kv(d.srPlay[2],A.atributos.map(a=>tv(a[0])).join(' · '))}</dl>`)}
 </div>
 <div class="sr-grid">
  ${sec('03',d.srSec[2],`<dl class="sr-kv">${kv(d.srInd[0],TOT.j+' / '+fmt(TOT.m))}${kv(d.srInd[1],`${TOT.g} / ${TOT.a} <span class="muted">(${TOT.jGA} ${d.srGames})</span>`)}${kv(d.srInd[2],ga90.toFixed(2).replace('.',en?'.':','))}${kv(d.srInd[3],`${kov.jogos} ${d.srGames} · ${kov.gols} ${en?'goal':'gol'} · ${kov.assist} ${en?'assists':'assist.'} · ${kov.min} min`)}</dl>`)}
 </div>
  ${sec('04',d.srSec[3],`<dl class="sr-kv">${kv(d.srVideoLbl,`<a href="${A.video.url}" target="_blank" rel="noopener">${d.srVideo} ↗</a>`)}</dl>`)}
 </div>
 ${sec('05',d.srSec[4],`<dl class="sr-kv">${kv('WhatsApp','+55 11 95453-9870')}${kv('Instagram','@matheus_matueda')}${kv('E-mail',c.email)}${kv(d.srRep,d.srNoRep)}</dl>`)}
 ${sec('06',d.srSec[5],`<ul class="sr-list">${titles}</ul>`)}
`);

 /* vídeo */
 set('e-vid',d.eVid); set('h-vid',d.hVid); set('p-vid',d.pVid); set('t-watch',d.tWatch); set('vnote',d.vNote);
 if(A.video&&A.video.url){
   $('vcard').href=A.video.url;
   $('vcard').innerHTML=`${A.video.capa?`<img src="${A.video.capa}" alt="${en?'Video cover':'Capa do vídeo'}">`:''}<span class="play"><span>${ICON.play}</span></span><span class="yt">${d.ytLabel}</span>`;
   html('vinfo',[[en?'Content':'Conteúdo',d.vContent],[d.tPos,`${d.pos[0][1]} · ${d.pos[1][1]}`],[en?'Platform':'Plataforma','YouTube']].map(r=>`<div class="vrow"><span>${r[0]}</span><span>${r[1]}</span></div>`).join(''));
   html('vcta',`<a class="btn green" href="${A.video.url}" target="_blank" rel="noopener">${d.vOpen} ↗</a>`);
 }else{const s=document.getElementById('video');if(s)s.remove()}

 /* imprensa */
 set('h-press',d.hPress); set('p-press',d.pPress);
 html('press',(A.imprensa||[]).map(m=>{const t=(en&&PE[m.veiculo])||{};
   const ti=t.titulo||m.titulo, rs=t.resumo||m.resumo, tr=t.trecho||m.trecho;
   return `<a class="pcard" href="${m.link}" target="_blank" rel="noopener"><div class="src"><span>${m.veiculo}</span><span>${m.data?fd(m.data):''}</span></div>${ti?`<h3>${ti}</h3>`:''}${rs?`<p>${rs}</p>`:''}${tr?`<blockquote>${tr}</blockquote>`:''}<span class="go">${d.read} →</span></a>`}).join(''));

 /* contato */
 set('h-contact',d.hContact); set('contactLead',d.contactLead);
 html('cta2',(c.whatsapp?`<a class="btn gold" href="https://wa.me/${c.whatsapp}" target="_blank" rel="noopener">${d.bWa}</a>`:'')+(c.email?`<a class="btn line" id="mailbtn" href="mailto:${c.email}" target="_blank" rel="noopener">${c.email}</a>`:'')+(c.instagram?`<a class="btn line" href="${c.instagram}" target="_blank" rel="noopener">${d.bInsta} @matheus_matueda</a>`:'')+`<button type="button" class="btn line" id="sharebtn">${d.bShare}</button>`);
 set('foot',d.foot);
}

$('lang').addEventListener('click',e=>{const l=e.target.dataset.l;if(l&&l!==lang){lang=l;try{localStorage.setItem('lang',l)}catch(_){}paint()}});
const flashBtn=(btn,txt)=>{const o=btn.textContent;btn.textContent=txt;setTimeout(()=>{btn.textContent=o},1800)};
const copyTxt=t=>new Promise((res,rej)=>{
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(res,rej);return}
 try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();res()}catch(e){rej(e)}});
$('cta2').addEventListener('click',e=>{
 const mb=e.target.closest('#mailbtn'), sb=e.target.closest('#sharebtn');
 if(mb){copyTxt(c.email).then(()=>flashBtn(mb,D[lang].mailCopied)).catch(()=>{});return}
 if(!sb)return;
 const t=document.title, txt=D[lang].shareText;
 const fb=()=>copyTxt(SHARE_URL).then(()=>flashBtn(sb,D[lang].copied)).catch(()=>{});
 if(navigator.share){navigator.share({title:t,text:txt,url:SHARE_URL}).catch(err=>{if(!err||err.name!=='AbortError')fb()})}
 else fb();
});
$("heroImg").src=PHOTO;
paint();
(function(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const go=el=>{const end=+el.dataset.count;let st=null;const f=ts=>{if(st===null)st=ts;const q=Math.min(1,(ts-st)/1100);
  el.textContent=Number(Math.round(end*(1-Math.pow(1-q,3)))).toLocaleString(document.documentElement.lang==='en'?'en':'pt-BR');
  if(q<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
 const els=[...document.querySelectorAll('[data-count]')];
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){go(x.target);io.unobserve(x.target)}}),{threshold:.4});els.forEach(e=>io.observe(e))}
 else els.forEach(go);
})();
if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
 const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.06});
 document.querySelectorAll('main section, .sixty').forEach(el=>{el.classList.add('reveal');io.observe(el)});
}
